# Copy into a seller repository. Pin the full commit SHA of the
# v0.1.0-candidate.8 tree, the first tag that contains this Action.
# Marketplace or tag syntax is a convenience. Do not use @main, a
# floating tag, npm, or pull_request_target. A passing run is
# seller-declared unpaid contract evidence, not runtime, settlement,
# delivery, demand, or adoption proof. The package remains unpublished
# on npm.
#
# permissions.security-events is required only when upload-sarif is true.
# Fork pull_request jobs do not receive security-events write; the action
# skips SARIF upload for those jobs so a passing audit is not turned into
# a permission failure. The action accepts no secrets, wallets, or payment
# credentials.

name: seller-contract-integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: epistemedeus/agent-payment-integrity@REPLACE_WITH_COMMIT_SHA
        with:
          origin: https://seller.example
          route: /read
          max-routes: "1"
          format: sarif
          out: audit-result.sarif
          upload-sarif: "true"
