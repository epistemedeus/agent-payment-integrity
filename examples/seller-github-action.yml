# Copy into a seller repository. Pin a 40-character commit SHA from
# grok/cleanroom-action-consumer-20260820. Do not use @main, a floating
# tag, npm, or an unresolved placeholder ref.
#
# upload-sarif defaults to false. security-events is required only when
# you set upload-sarif true. The action accepts no secrets, wallets, or
# payment credentials. Replace origin with a public HTTPS seller.

name: seller-contract-integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: epistemedeus/agent-payment-integrity@55b94ce8da37810b886ac69f8e45b5cb1c8e3ab3
        with:
          origin: https://YOUR_PUBLIC_ORIGIN.example
          route: /read
          max-routes: "1"
          format: sarif
          out: audit-result.sarif
