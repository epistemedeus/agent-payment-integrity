# Copy into a seller repository. Pin the commit SHA from
# grok/integrity-distribution-convergence-20260820. Do not use @main, a
# floating tag, or npm.
#
# permissions.security-events is required only when upload-sarif is true.
# The action accepts no secrets, wallets, or payment credentials.

name: seller-contract-integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: epistemedeus/agent-payment-integrity@REPLACE_WITH_COMMIT_SHA
        with:
          origin: https://seller.example
          route: /read
          max-routes: "1"
          format: sarif
          out: audit-result.sarif
          upload-sarif: "true"
